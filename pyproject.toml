[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftguard"
version = "0.1.0"
description = "CPU-first CIFAR-10 classification error detection experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torchvision>=0.17,<1", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "joblib>=1.3,<2", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
